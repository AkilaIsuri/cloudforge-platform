spring.application.name=product-service
server.port=8080
server.shutdown=graceful
server.error.include-message=always

# Overridden by SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD environment variables
spring.datasource.url=jdbc:postgresql://localhost:5432/products_db

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
# Latency histogram buckets so Prometheus can calculate p95/p99 response times
management.metrics.distribution.percentiles-histogram.http.server.requests=true
