spring.application.name=order-service
server.port=8080
server.shutdown=graceful
server.error.include-message=always

# Overridden by SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD environment variables
spring.datasource.url=jdbc:postgresql://localhost:5432/orders_db

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Other services this one calls (Docker Compose / Kubernetes service names are set via env vars)
services.user-url=${USER_SERVICE_URL:http://localhost:8081}
services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084}

# Fail fast instead of hanging when a downstream service is down
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=5s

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
# Latency histogram buckets so Prometheus can calculate p95/p99 response times
management.metrics.distribution.percentiles-histogram.http.server.requests=true
