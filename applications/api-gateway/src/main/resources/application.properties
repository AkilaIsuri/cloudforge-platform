spring.application.name=api-gateway
server.port=8080
server.shutdown=graceful

# Where each backend service lives (set to Docker Compose / Kubernetes service names via env vars)
services.user-url=${USER_SERVICE_URL:http://localhost:8081}
services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.order-url=${ORDER_SERVICE_URL:http://localhost:8083}
services.payment-url=${PAYMENT_SERVICE_URL:http://localhost:8084}

# Browser origins allowed to call the API directly (only needed for `npm run dev`;
# in Docker/Kubernetes the frontend's nginx proxies /api so the browser sees one origin)
cloudforge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
# Latency histogram buckets so Prometheus can calculate p95/p99 response times
management.metrics.distribution.percentiles-histogram.http.server.requests=true
