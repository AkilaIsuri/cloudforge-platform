name: Test AWS OIDC

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

jobs:
  aws-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::761558631184:role/cloudforge-github-actions-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t user-service:${GITHUB_SHA}\
            ./applications/user-service

      - name: Tag Docker image
        run: |
          docker tag \
            user-service:${GITHUB_SHA} \
            761558631184.dkr.ecr.us-east-1.amazonaws.com/user-service:${GITHUB_SHA}

      - name: Push Docker image
        run: |
          docker push \
            761558631184.dkr.ecr.us-east-1.amazonaws.com/user-service:${GITHUB_SHA}

      - name: Update Helm image tag
        run: |
          sed -i "s/^    tag: .*/    tag: \"${GITHUB_SHA}\"/" helm/cloudforge/values.yaml

      - name: Verify Helm image tag
        run: |
          grep -A4 "image:" helm/cloudforge/values.yaml

      - name: Commit updated Helm image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/cloudforge/values.yaml
          git commit -m "Update user-service image to ${GITHUB_SHA}"
          git push