# Dependabot: monthly PRs for patch/minor updates, grouped per ecosystem.
# Major versions (e.g. Spring Boot 4, Java 25+, React plugin 6) are planned upgrades, not automatic PRs,
# so they are ignored here (see docs/security.md "Known gaps and future work").
# Every update still goes through the normal PR checks (tests, SonarCloud, Trivy) before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /applications/user-service
      - /applications/product-service
      - /applications/order-service
      - /applications/payment-service
      - /applications/api-gateway
      - /applications/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Java 21 is the LTS version the services are compiled for – no automatic jump to 22+
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directories:
      - /applications/user-service
      - /applications/product-service
      - /applications/order-service
      - /applications/payment-service
      - /applications/api-gateway
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maven-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /applications/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
