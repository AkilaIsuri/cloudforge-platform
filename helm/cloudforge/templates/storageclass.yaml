{{- /* EKS only: encrypted gp3 disks through the EBS CSI driver (installed by Terraform) */}}
{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
provisioner: ebs.csi.aws.com
# Create the disk in the same availability zone as the pod that uses it
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
{{- end }}
