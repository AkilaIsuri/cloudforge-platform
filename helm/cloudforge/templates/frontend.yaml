{{- $fe := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  replicas: {{ $fe.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        {{- include "cloudforge.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # "nginx" user in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "cloudforge.image" (list . $fe) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx forwards /api/* to the gateway
            - name: API_GATEWAY_URL
              value: {{ $fe.apiGatewayUrl | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml $fe.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  type: {{ $fe.service.type }}
  selector:
    app: frontend
  ports:
    - name: http
      port: {{ $fe.service.port }}
      targetPort: http
      {{- if and (eq $fe.service.type "NodePort") $fe.service.nodePort }}
      nodePort: {{ $fe.service.nodePort }}
      {{- end }}
