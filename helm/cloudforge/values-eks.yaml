# Amazon EKS. Not used yet – it is wired into CI and Argo CD in a later step.
# CI will write the built commit SHA into global.imageTag.

global:
  imageRepositoryPrefix: 761558631184.dkr.ecr.us-east-1.amazonaws.com
  imageTag: "CHANGE_ME_BY_CI"
  imagePullPolicy: IfNotPresent

springDefaults:
  replicas: 2

frontend:
  replicas: 2
  service:
    type: LoadBalancer
    port: 80

postgres:
  storage: 10Gi
  # Needs the EBS CSI driver add-on in the cluster (added in the Terraform step)
  storageClassName: gp2
