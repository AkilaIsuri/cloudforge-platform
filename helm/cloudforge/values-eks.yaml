# Amazon EKS – used by Argo CD (argocd/cloudforge-app.yaml).
# CI writes the built commit SHA into global.imageTag on every push to main.

global:
  # ECR registry of the CloudForge AWS account (terraform output ecr_registry)
  imageRepositoryPrefix: 125610095979.dkr.ecr.us-east-1.amazonaws.com
  imageTag: "a9212a64d1be16e230fd63a1c9fd651a9edabd21"
  imagePullPolicy: IfNotPresent

springDefaults:
  replicas: 2

services:
  api-gateway:
    env:
      # Browser origins allowed by the gateway (see docs/Issues.md #2): the VoltCart AWS load balancer
      # URL, plus localhost:8088 for `kubectl port-forward`. The load balancer URL changes if the
      # frontend Service or the cluster is recreated – update it here then.
      CORS_ALLOWED_ORIGINS: "http://a52c4e80260eb4c16a64d4e230c139aa-1885552927.us-east-1.elb.amazonaws.com,http://localhost:8088"

frontend:
  replicas: 2
  service:
    type: LoadBalancer
    port: 80

# Encrypted gp3 disks via the EBS CSI driver (installed by Terraform)
storageClass:
  create: true
  name: gp3

postgres:
  storage: 10Gi
  storageClassName: gp3
