# Amazon EKS – used by Argo CD (argocd/cloudforge-app.yaml).
# CI writes the built commit SHA into global.imageTag on every push to main.

global:
  # ECR registry of the CloudForge AWS account (terraform output ecr_registry)
  imageRepositoryPrefix: 125610095979.dkr.ecr.us-east-1.amazonaws.com
  imageTag: "6653e5012a598653e6cedb3a64d962d5012bb4cf"
  imagePullPolicy: IfNotPresent

springDefaults:
  replicas: 2

services:
  api-gateway:
    env:
      # Set to the VoltCart load balancer URL once it exists, e.g.
      # "http://a1b2c3-123456.us-east-1.elb.amazonaws.com" (see docs/Issues.md #2)
      CORS_ALLOWED_ORIGINS: "http://localhost:8088"

frontend:
  replicas: 2
  service:
    type: LoadBalancer
    port: 80

# Encrypted gp3 disks via the EBS CSI driver (installed by Terraform)
storageClass:
  create: true
  name: gp3

postgres:
  storage: 10Gi
  storageClassName: gp3
